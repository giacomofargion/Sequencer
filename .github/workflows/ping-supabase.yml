name: Ping Supabase to Prevent Pausing

on:
  schedule:
    # Runs twice daily at 9:00 AM and 9:00 PM UTC
    # Format: minute hour day-of-month month day-of-week
    - cron: "0 9 * * *" # 9:00 AM UTC
    - cron: "0 21 * * *" # 9:00 PM UTC
  workflow_dispatch: # Allows manual triggering from the GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      # REST ping only — avoids @supabase/supabase-js Realtime/WebSocket on Node < 22
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "❌ Missing required secrets: NEXT_PUBLIC_SUPABASE_URL and/or SUPABASE_SERVICE_ROLE_KEY"
            exit 1
          fi

          http_code=$(curl -sS -o /tmp/supabase-ping-body.json -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/rooms?select=id&limit=1" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}")

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "❌ Error pinging Supabase: HTTP ${http_code}"
            cat /tmp/supabase-ping-body.json
            exit 1
          fi

          echo "✅ Ping successful! Database is active."
          echo "Response: $(cat /tmp/supabase-ping-body.json)"
